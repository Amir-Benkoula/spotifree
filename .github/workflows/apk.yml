# Builds the Android app on GitHub, no computer needed, and publishes it as the
# "apk" pre-release, to download and install straight from a phone:
#   https://github.com/Amir-Benkoula/spotifree/releases/download/apk/spotiweb.apk
# Runs on every push to main or a claude/ branch, and on demand from the
# Actions tab (GitHub app or website: APK > Run workflow).
name: APK

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

# One build publishes at a time; the last one wins.
concurrency:
  group: apk
  cancel-in-progress: false

permissions:
  contents: write # The release.

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Android only installs an APK over one signed with the same key. Optional
      # repository secret: a debug keystore in base64 (such as the computer's
      # ~/.android/debug.keystore, so that its builds and these update each
      # other). Without it, the key made by the first build is kept in the cache.
      DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4 # As in .metadata.
          channel: stable
          cache: true

      - name: Signing key, kept between builds
        if: env.DEBUG_KEYSTORE == ''
        uses: actions/cache@v5
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore

      - name: Signing key
        run: |
          mkdir -p ~/.android
          echo "ANDROID_USER_HOME=$HOME/.android" >> "$GITHUB_ENV"
          if [ -n "$DEBUG_KEYSTORE" ]; then
            echo "$DEBUG_KEYSTORE" | base64 -d > ~/.android/debug.keystore
          elif [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
          # Public: tells whether two builds can update each other.
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android | grep -m1 'SHA256:'

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # GeckoView is only bundled for arm64 (android/app/build.gradle.kts). The
      # build number (versionCode) grows with each run, so that each APK updates
      # the previous one; the app knows it too, to look for newer ones
      # (lib/src/updater.dart, version.json below).
      - name: Build
        run: |
          flutter build apk --release --target-platform android-arm64 \
            --build-name=1.0.$GITHUB_RUN_NUMBER --build-number=$GITHUB_RUN_NUMBER \
            --dart-define=SPOTIWEB_BUILD=$GITHUB_RUN_NUMBER \
            --dart-define=SPOTIWEB_COMMIT=${GITHUB_SHA::7} \
            --dart-define=SPOTIWEB_REPO=$GITHUB_REPOSITORY

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk spotiweb.apk
          sha=$(git rev-parse --short HEAD)
          # What the app compares itself with.
          jq -n --argjson build "$GITHUB_RUN_NUMBER" --arg commit "$sha" --arg notes "$(git log -1 --format=%s)" \
            '{build: $build, commit: $commit, notes: $notes}' > version.json
          {
            echo "Branche \`$GITHUB_REF_NAME\`, commit $sha :"
            echo
            git log -1 --format=%B
          } > notes.md
          gh release delete apk --cleanup-tag --yes || true
          gh release create apk spotiweb.apk version.json --prerelease --target "$GITHUB_SHA" \
            --title "SpotiWeb 1.0.$GITHUB_RUN_NUMBER – $GITHUB_REF_NAME ($sha)" --notes-file notes.md
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/apk/spotiweb.apk"
          echo "### [Télécharger l'APK]($url)" >> "$GITHUB_STEP_SUMMARY"
